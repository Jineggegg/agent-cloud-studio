<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/studio-icon.svg?v=57f6ad94" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Agent Cloud Studio</title>

    <!-- Fonts: Encode Sans (UI) + Merriweather (chat). Loaded without blocking the first paint:
         the Studio uses the system font stack, and a slow or blocked Google Fonts request
         (common on mainland networks) must never hold the launch screen back. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />

    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent Studio" />

    <!-- iOS Safari Icons: opaque and full-bleed (iOS rounds them). All logo files come from public/studio-icon.svg,
         and their ?v= is stamped by scripts/generate-studio-icons.mjs so a changed logo is never served from cache. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/studio-apple-180.png?v=57f6ad94" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/studio-apple-167.png?v=57f6ad94" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/studio-apple-152.png?v=57f6ad94" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />

    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Apply the saved theme before first paint so dark mode never flashes white (mirrors ThemeContext).
         The launch screen below reads the same `html.dark` class. -->
    <script>
      (function () {
        var root = document.documentElement;
        var systemDark = !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = systemDark;
        try {
          var prefs = JSON.parse(localStorage.getItem('user-preferences') || '{}');
          var mode = prefs.theme === 'dark' || prefs.theme === 'light' ? prefs.theme : 'system';
          dark = mode === 'dark' || (mode === 'system' && systemDark);
        } catch (error) { /* Storage unavailable: follow the system until the app applies the saved theme. */ }
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.style.backgroundColor = dark ? '#121315' : '#efede8';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#121315' : '#efede8');
      })();
    </script>

    <!-- Launch screen. Pure inline CSS/SVG so it paints before any script runs and before the app
         stylesheet arrives (the build loads that without blocking: vite.config.js). On a plain white (or, at night,
         near-black) backdrop, the base of the Studio home wallpaper, the Studio's mark, a four-pointed spark in a
         halo, draws itself in (the halo first, then the star in one stroke, about 1.1 s) and then turns in quarter
         turns, the halo the other way, for as long as loading lasts. Every moving part is a CSS animation of a
         stroke offset or a transform, which the browser runs off the main thread, so it stays smooth while the app's
         JavaScript downloads and parses.
         React releases it (LaunchSplashRelease in src/shared/ui/LaunchScreen.tsx) once the first real screen has
         painted with the app stylesheet applied, and not before the draw-in has played (the `data-shown-at` stamp
         below): the star comes to rest upright at the end of its quarter turn and grows into a star-shaped window
         through which the app, already rendered underneath, settles into place. LaunchScreen and the error screen in
         the same file reuse these `.acs-launch` and `.acs-star` styles, as does the studio module when an app opens
         from its icon (StudioAppLaunch). -->
    <style>
      .acs-launch {
        /* Backdrop: the wallpaper's plain base (utils/wallpaperBlobs, wallpaperBase), with no colour of its own. */
        --launch-bg: #f8fafb;
        --launch-bg-2: #f4f6f7;
        --launch-glass-top: rgba(255, 255, 255, .8);
        --launch-glass-bottom: rgba(255, 255, 255, .36);
        --launch-edge: rgba(255, 255, 255, .92);
        --launch-ink: #1f6fd1;
        --launch-ink-2: #2a9d4f;
        --launch-label: #5d6670;
        --launch-ease: cubic-bezier(.22, .8, .2, 1);
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: linear-gradient(180deg, var(--launch-bg), var(--launch-bg-2));
        color: var(--launch-label);
        font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
        letter-spacing: .02em;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      html.dark .acs-launch {
        --launch-bg: #101112;
        --launch-bg-2: #09090a;
        --launch-glass-top: rgba(255, 255, 255, .17);
        --launch-glass-bottom: rgba(255, 255, 255, .05);
        --launch-edge: rgba(255, 255, 255, .26);
        --launch-ink: #7cc0ff;
        --launch-ink-2: #6fdc8c;
        --launch-label: #9aa3ad;
      }
      /* The mark sits at the exact centre, like an iOS launch screen; the slow-network hint hangs below it. */
      .acs-launch-star {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 132px;
        height: 132px;
        margin: -66px 0 0 -66px;
      }

      /* The four-pointed spark (src/shared/ui/StarSpark.tsx draws the same markup; the geometry is in starSpark.ts).
         Its lines draw in through a dash the length of each path (pathLength="1"): the halo's two arcs first, the
         star in one stroke a moment later. `is-turning` turns it a quarter turn at a time and the halo backwards;
         `is-zooming` (the star window) sends the halo off and makes the star a thin line of constant width however
         large it grows. Variables: --star-draw (draw-in length), --star-turn-delay, --star-stroke (viewBox units). */
      .acs-star {
        --star-draw: 1100ms;
        --star-turn-delay: 0ms;
        --star-stroke: 4.5;
        overflow: visible;
        pointer-events: none;
      }
      .acs-star path {
        fill: none;
        stroke-width: var(--star-stroke);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1 1;
        animation: acs-star-draw calc(var(--star-draw) * .55) cubic-bezier(.6, 0, .25, 1) both;
      }
      .acs-star-arc + .acs-star-arc { animation-delay: calc(var(--star-draw) * .1); }
      .acs-star-spark path { animation-duration: calc(var(--star-draw) * .75); animation-delay: calc(var(--star-draw) * .25); }
      .acs-star-halo, .acs-star-spark { transform-origin: 50px 50px; }
      .acs-star.is-turning .acs-star-spark { animation: acs-star-turn 900ms cubic-bezier(.6, 0, .3, 1) var(--star-turn-delay) infinite; }
      .acs-star.is-turning .acs-star-halo { animation: acs-star-halo 1800ms linear var(--star-turn-delay) infinite; }
      .acs-star.is-zooming .acs-star-halo { opacity: 0; scale: 1.35; transition: opacity 220ms ease-out, scale 220ms ease-out; }
      .acs-star.is-zooming .acs-star-spark path { animation: none; stroke-dasharray: none; stroke-width: 3px; vector-effect: non-scaling-stroke; }
      @keyframes acs-star-draw { from { stroke-dashoffset: 1; opacity: 0; } 4% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes acs-star-turn { to { transform: rotate(90deg); } }
      @keyframes acs-star-halo { to { transform: rotate(-360deg); } }

      /* The logo as the app icon draws it (public/studio-icon.svg): the spark in its halo on a dark tile with a soft
         mint glow, drawing itself in. The error screen, the sign-in screens and Settings → 关于本机 show it (LaunchMark). */
      .acs-launch-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 22.3%;
        background:
          radial-gradient(closest-side, rgba(24, 194, 156, .22), rgba(24, 194, 156, 0) 66%),
          linear-gradient(180deg, #17191d, #060708);
        box-shadow: 0 1px 2px rgba(20, 35, 55, .08), 0 22px 48px -18px rgba(20, 35, 55, .42);
        animation: acs-launch-in 560ms var(--launch-ease) both;
      }
      .acs-launch-mark > .acs-star { width: 76%; height: 76%; }
      /* Only when the network is genuinely slow: an honest note and a way to retry. */
      .acs-launch-hint {
        position: absolute;
        left: 16px;
        right: 16px;
        top: calc(50% + 96px);
        margin: 0;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        animation: acs-launch-reveal 500ms ease 12s forwards;
      }
      .acs-launch-hint :is(a, button) {
        display: inline-block;
        min-height: 44px;
        padding: 12px 10px;
        border: 0;
        background: none;
        color: var(--launch-ink);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      @keyframes acs-launch-in { from { opacity: 0; transform: scale(.94); } }
      @keyframes acs-launch-reveal { to { opacity: 1; visibility: visible; } }

      /* Error screen (LaunchErrorBoundary in src/shared/ui/LaunchScreen.tsx): the same backdrop with the
         mark held still, an honest message and two ways out. Styled here so it works without the app CSS. */
      .acs-launch-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        text-align: center;
        -webkit-user-select: text;
        user-select: text;
      }
      .acs-launch-error .acs-launch-mark { flex: none; width: 72px; height: 72px; margin-bottom: 10px; }
      .acs-launch-error h1 { margin: 0; color: var(--launch-ink); font-size: 17px; font-weight: 600; letter-spacing: 0; }
      .acs-launch-error p { max-width: 340px; margin: 0; }
      .acs-launch-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
      .acs-launch-actions :is(a, button) {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 22px;
        background: var(--launch-glass-top);
        box-shadow: inset 0 0 0 .5px var(--launch-edge), 0 8px 20px -14px rgba(20, 35, 55, .4);
        color: var(--launch-ink);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      /* The splash keeps its backdrop in a layer of its own: leaving, the star window is cut out of that layer as a
         hole (clip-path, set every frame by LaunchSplashRelease) while the star's outline rides the hole's edge above
         it, unclipped. `data-phase="zoom"` is that zoom; `data-phase="fade"` is the plain fade used under reduced
         motion. */
      #launch-splash { z-index: 2147483000; background: none; }
      .acs-launch-backdrop { position: absolute; inset: 0; background: linear-gradient(180deg, var(--launch-bg), var(--launch-bg-2)); }
      #launch-splash[data-phase] { pointer-events: none; }
      #launch-splash[data-phase] .acs-launch-hint { display: none; }
      #launch-splash[data-phase="fade"] { opacity: 0; visibility: hidden; transition: opacity 200ms ease, visibility 0s linear 200ms; }
      /* While the app stylesheet still downloads (the build preloads it and turns it into a stylesheet on
         load), React may already have rendered: keep that unstyled tree (and any portal) out of layout so it
         cannot add scrollbars or reflow behind the splash. Screens drawn with these inline `.acs-launch`
         styles stay, so the error screen shows even when the stylesheet never arrives. The splash itself
         waits for the styles before leaving (LaunchSplashRelease). */
      html:has(link[data-acs-entry-style][rel="preload"]) :is(#root > :not(.acs-launch), body > :not(#root, #launch-splash)) {
        display: none;
      }
      /* Seen through the growing window, the app settles from slightly larger and out of focus. #root sits outside
         .acs-launch, so the easing is spelled out; LaunchSplashRelease removes the class afterwards, as a transformed
         #root would re-anchor every `position: fixed` sheet. */
      html.acs-app-entering #root { transform-origin: 50vw 50vh; animation: acs-app-enter 1000ms cubic-bezier(.2, .8, .2, 1); }
      @keyframes acs-app-enter { from { transform: scale(1.1); filter: blur(6px); } }

      /* Reduced motion: the mark is simply there, drawn and still, and the splash fades. */
      @media (prefers-reduced-motion: reduce) {
        .acs-launch-mark, .acs-star path, .acs-star.is-turning :is(.acs-star-halo, .acs-star-spark) { animation: none; }
        .acs-star path { stroke-dasharray: none; }
        html.acs-app-entering #root { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="launch-splash" class="acs-launch" role="status" aria-live="polite" aria-label="正在启动 Agent Cloud Studio">
      <div class="acs-launch-backdrop"></div>
      <!-- The same markup as StarSpark (src/shared/ui/StarSpark.tsx); it starts turning once its draw-in is over. -->
      <svg class="acs-star acs-launch-star is-turning" style="--star-turn-delay: var(--star-draw)" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="acs-star-splash" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2f8cff" /><stop offset=".5" stop-color="#18c29c" /><stop offset="1" stop-color="#ff8a1f" />
          </linearGradient>
        </defs>
        <g class="acs-star-halo">
          <path class="acs-star-arc" d="M50 4 A46 46 0 0 1 96 50" pathLength="1" stroke="url(#acs-star-splash)" />
          <path class="acs-star-arc" d="M50 96 A46 46 0 0 1 4 50" pathLength="1" stroke="url(#acs-star-splash)" />
        </g>
        <g class="acs-star-spark"><path d="M50 16 C53 40 60 47 84 50 C60 53 53 60 50 84 C47 60 40 53 16 50 C40 47 47 40 50 16 Z" pathLength="1" stroke="url(#acs-star-splash)" /></g>
      </svg>
      <p class="acs-launch-hint">网络较慢，仍在加载…<a href="">重新加载</a></p>
    </div>
    <!-- When the splash first showed, so LaunchSplashRelease lets the draw-in finish before it leaves. -->
    <script>document.getElementById('launch-splash').setAttribute('data-shown-at', String(Math.round(performance.now())));</script>
    <!-- src/main.tsx also registers the service worker, as soon as it runs. (A second registration
         here waited for window `load`, which a blocked Google Fonts request can hold back for long.) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
